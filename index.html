---
layout: default
---
<h1>Ivan Loughman</h1>

<h2>Writing</h2>
{% if site.posts.size > 0 %}
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">Nothing here yet — soon.</p>
{% endif %}
