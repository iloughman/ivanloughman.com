<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="theme-color" content="#121416">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <a class="skip" href="#content">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>
  <main id="content">
    {{ content }}
  </main>
</body>
</html>
