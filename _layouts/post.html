---
layout: default
---
<nav class="crumbs"><a href="{{ '/' | relative_url }}">← Ivan Loughman</a></nav>
<article class="post{% if page.poem %} poem{% endif %}">
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  <div class="body">
    {{ content }}
  </div>
</article>
